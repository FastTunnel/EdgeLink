name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-beacon:
    name: Build edgelink-beacon (${{ matrix.deb_arch }} musl static)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            deb_arch: amd64
          - target: aarch64-unknown-linux-musl
            deb_arch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev musl-tools

      - name: Install cross tool for ARM64 musl
        if: matrix.target == 'aarch64-unknown-linux-musl'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build Binary (x86_64 musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          cargo build --release --manifest-path edgelink-beacon/Cargo.toml --target ${{ matrix.target }}

      - name: Build Binary (ARM64 musl)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          cross build --release --manifest-path edgelink-beacon/Cargo.toml --target ${{ matrix.target }}

      - name: Verify Static Linking
        run: |
          BIN_PATH="edgelink-beacon/target/${{ matrix.target }}/release/edgelink-beacon"
          file "$BIN_PATH"
          # 验证不依赖动态 glibc
          if command -v ldd >/dev/null 2>&1; then
            ldd "$BIN_PATH" 2>&1 || true
          fi

      - name: Package Debian (.deb)
        run: |
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' edgelink-beacon/Cargo.toml | head -n 1)
          BIN_PATH="edgelink-beacon/target/${{ matrix.target }}/release/edgelink-beacon"
          PACKAGE_NAME="edgelink-beacon_${VERSION}_${{ matrix.deb_arch }}.deb"
          STAGE_DIR=$(mktemp -d)
          mkdir -p dist

          install -D -m 0755 "$BIN_PATH" "$STAGE_DIR/usr/bin/edgelink-beacon"
          install -D -m 0644 edgelink-beacon/packaging/edgelink-beacon.service "$STAGE_DIR/lib/systemd/system/edgelink-beacon.service"
          mkdir -p "$STAGE_DIR/usr/share/doc/edgelink-beacon"
          cat > "$STAGE_DIR/usr/share/doc/edgelink-beacon/README.Debian" <<'EOF'
The service listens on UDP port 40191 by default. Statically linked with musl libc.
EOF

          mkdir -p "$STAGE_DIR/DEBIAN"
          cat > "$STAGE_DIR/DEBIAN/control" <<EOF
Package: edgelink-beacon
Version: $VERSION
Section: net
Priority: optional
Architecture: ${{ matrix.deb_arch }}
Depends: systemd, init-system-helpers
Maintainer: EdgeLink Project <noreply@localhost>
Description: EdgeLink Beacon - Musl fully static UDP discovery responder for Edge Linux boards
 Pure static binary compiled with musl libc. Guaranteed to run on any Linux kernel/distribution
 without glibc version dependency issues.
EOF

          cat > "$STAGE_DIR/DEBIAN/postinst" <<'EOF'
#!/bin/sh
set -e
if [ "$1" = "configure" ]; then
    systemctl --system daemon-reload >/dev/null 2>&1 || true
    systemctl enable edgelink-beacon.service >/dev/null 2>&1 || true
    systemctl restart edgelink-beacon.service >/dev/null 2>&1 || true
fi
exit 0
EOF
          chmod 0755 "$STAGE_DIR/DEBIAN/postinst"

          cat > "$STAGE_DIR/DEBIAN/prerm" <<'EOF'
#!/bin/sh
set -e
if [ "$1" = "remove" ] || [ "$1" = "deconfigure" ]; then
    systemctl stop edgelink-beacon.service >/dev/null 2>&1 || true
    systemctl disable edgelink-beacon.service >/dev/null 2>&1 || true
fi
exit 0
EOF
          chmod 0755 "$STAGE_DIR/DEBIAN/prerm"

          dpkg-deb --build --root-owner-group "$STAGE_DIR" "dist/$PACKAGE_NAME"

      - name: Create tar.gz archive
        run: |
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' edgelink-beacon/Cargo.toml | head -n 1)
          BIN_PATH="edgelink-beacon/target/${{ matrix.target }}/release/edgelink-beacon"
          STAGE_DIR=$(mktemp -d)
          cp "$BIN_PATH" "$STAGE_DIR/edgelink-beacon"
          cp edgelink-beacon/packaging/edgelink-beacon.service "$STAGE_DIR/"
          cp edgelink-beacon/README.md "$STAGE_DIR/"
          tar -czvf "dist/edgelink-beacon_${VERSION}_${{ matrix.deb_arch }}_musl_static.tar.gz" -C "$STAGE_DIR" .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: beacon-${{ matrix.deb_arch }}
          path: dist/*
          if-no-files-found: error

  build-router:
    name: Build edgelink-router (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build and Package Windows Installer
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File edgelink-router/packaging/build-installer.ps1 -Profile release

      - name: Create Portable Zip Package
        shell: pwsh
        run: |
          $Toml = Get-Content "edgelink-router/Cargo.toml" -Raw
          $Version = if ($Toml -match 'version\s*=\s*"([^"]+)"') { $Matches[1] } else { "0.1.0" }
          $ZipName = "dist/edgelink-router_${Version}_windows_x64_portable.zip"
          Compress-Archive -Path @(
            "edgelink-router/target/release/edgelink-router.exe",
            "edgelink-router/target/release/edgelink-service.exe",
            "edgelink-router/target/release/edgelink-setup.exe",
            "edgelink-router/assets/app.ico",
            "edgelink-router/README.md"
          ) -DestinationPath $ZipName -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: router-windows-x64
          path: dist/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-beacon, build-router]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Determine Release Tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: EdgeLink Release ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: false
          files: release-assets/*
          generate_release_notes: true
          body: |
            ## 🚀 EdgeLink Release Assets

            ### 📦 Linux 开发板端 (edgelink-beacon - 100% Musl 完全静态链接，零 glibc 依赖)
            - **Debian/Ubuntu 安装包 (ARM64)**：`edgelink-beacon_*_arm64.deb`（推荐用于 RK3588、全志、树莓派等所有 ARM64 Linux 系统）
            - **Debian/Ubuntu 安装包 (x86_64)**：`edgelink-beacon_*_amd64.deb`（通用 x86_64 Linux 工控机/宿主机）
            - **独立纯静态压缩包**：`edgelink-beacon_*_arm64_musl_static.tar.gz` / `edgelink-beacon_*_amd64_musl_static.tar.gz`（解压即跑，不限发行版）

            ### 💻 Windows 桌面端 (edgelink-router)
            - **单文件一键安装向导**：`edgelink-router_*_x64_setup.exe`（自动部署、注册并启动后台服务、桌面快捷方式与控制面板卸载集成）
            - **免安装绿色便携包**：`edgelink-router_*_windows_x64_portable.zip`

            ---
            *完整校验和见 `SHA256SUMS.txt`*
